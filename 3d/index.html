<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1a24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

    background: #1d121a;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; }
  #rotate {
    display: none; position: fixed; left: 0; right: 0; bottom: 24px;
    text-align: center; color: #e9cfa8; opacity: .75;
    font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }

<body>
<canvas id="game" tabindex="0"></canvas>
<div id="rotate">Turn your phone sideways for a wider trail ↻</div>
<script>
(() => {
'use strict';

// Saghro Trek 3D: an over-the-shoulder spinoff of Saghro Trek (../index.html).
// The world is pseudo-3D: a curving, hilly trail is projected segment by
// segment onto a plain 2D canvas and everything on it is a scaled sprite,
// painted far to near. World units are metres: x across the trail, y up,
// z along it.

// ---------------------------------------------------------------- setup
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const H = 360, MIN_W = 480, MAX_W = 1000;
const CYCLE = 150;          // seconds for a full day/night cycle
const HOR = 112;            // screen y of the horizon
const FOCAL = 300;          // screen px per metre at 1 m from the camera
const SEG = 4;              // length of one trail segment
const DRAW = 208;           // draw distance
const CAM_BACK = 4.6, CAM_H = 3.0, SHOULDER = 0.7;  // camera sits behind, above and right of the hiker
const LANE = 1.6, ROAD = 2.7;                       // lane spacing, half-width of the trail
const SPAWN_AHEAD = 130;    // obstacles are placed this far ahead
let W = 640;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vh / H, vw / MIN_W);
  W = Math.round(Math.min(MAX_W, vw / scale));
  cvs.style.width = (W * scale) + 'px';
  cvs.style.height = (H * scale) + 'px';
  cvs.width = Math.round(W * scale * dpr);
  cvs.height = Math.round(H * scale * dpr);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let best = store.get('saghro3d.best', null);
if (!best || typeof best.score !== 'number') best = { score: 0, km: 0 };
let muted = store.get('saghro.muted', false) === true;
let isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

// ---------------------------------------------------------------- helpers
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
function rnd(i, k) { // deterministic hash -> [0,1)
  let h = Math.imul(i ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(k + 1, 0xc2b2ae35);
  h ^= h >>> 13; h = Math.imul(h, 0x27d4eb2f); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}
function vnoise(t, k) { // smooth deterministic noise -> [-1,1]
  const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
  return lerp(rnd(i, k), rnd(i + 1, k), u) * 2 - 1;
}
const hexCache = new Map();
function hex(c) {
  let v = hexCache.get(c);
  if (!v) { v = [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); hexCache.set(c, v); }
  return v;
}
const mixA = (A, B, t) => [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t];
const css = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const mix = (a, b, t) => css(mixA(hex(a), hex(b), t));
function weighted(list, r = Math.random()) {
  let total = 0; for (const [, w] of list) total += w;
  r *= total;
  for (const [v, w] of list) { if ((r -= w) < 0) return v; }
  return list[list.length - 1][0];
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, Math.PI * 2); }
function text(str, x, y, size, color, align = 'center', font = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif', weight = '600') {
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillText(str, x + 1, y + 1.5);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
const SERIF = 'Georgia, "Times New Roman", serif';

// ---------------------------------------------------------------- world data
const WAYPOINTS = [
  { m: 0,     name: 'Tagdilt',          sub: 'The trek begins. Mind your water.' },
  { m: 600,   name: "Tizi n'Tazazert",  sub: 'A windswept mountain pass' },
  { m: 1400,  name: 'Jbel Kouaouch',    sub: 'Summit country' },
  { m: 2500,  name: 'Igli',             sub: 'A quiet valley village' },
  { m: 3800,  name: "Bab n'Ali",        sub: 'The great rock towers' },
  { m: 5500,  name: "N'Kob",            sub: 'Trek complete! Keep walking…' },
  { m: 8000,  name: 'Tazzarine',        sub: 'South into the open desert' },
  { m: 11000, name: 'Erg Chebbi',       sub: 'Dunes on the horizon' },
];
function waypoint(i) {
  if (i < WAYPOINTS.length) return WAYPOINTS[i];
  const m = 11000 + (i - WAYPOINTS.length + 1) * 4000;
  return { m, name: `Deep Sahara · ${m / 1000} km`, sub: 'Nothing but sand and stars' };
}
function region(m) { return m < 3200 ? 'mtn' : m < 5200 ? 'bab' : m < 7600 ? 'oasis' : 'desert'; }
// Big scenery beside the trail, picked per segment and side.
const FEATURES = {
  mtn:    [['empty', 40], ['spire', 38], ['kasbah', 6], ['palm', 6], ['cairn', 10]],
  bab:    [['empty', 22], ['spire', 72], ['kasbah', 6]],
  oasis:  [['empty', 25], ['spire', 12], ['kasbah', 20], ['palm', 43]],
  desert: [['empty', 35], ['dune', 50], ['palm', 8], ['spire', 7]],
};
// Ground colours along the route: [metres, off-trail, trail].
const TERRAIN = [
  [0, '#a8744a', '#d4a46c'], [3000, '#a8744a', '#d4a46c'],
  [3500, '#a35c43', '#cf9a68'], [5000, '#a35c43', '#cf9a68'],
  [5500, '#8c8247', '#d2a56c'], [7300, '#8c8247', '#d2a56c'],
  [8000, '#dcaa68', '#ecc489'],
].map(([m, off, trail]) => ({ m, off: hex(off), trail: hex(trail) }));
function terrain(z) {
  let i = 0;
  while (i < TERRAIN.length - 1 && TERRAIN[i + 1].m <= z) i++;
  const a = TERRAIN[i], b = TERRAIN[Math.min(i + 1, TERRAIN.length - 1)];
  const t = b === a ? 0 : clamp((z - a.m) / (b.m - a.m), 0, 1);
  return { off: mixA(a.off, b.off, t), trail: mixA(a.trail, b.trail, t) };
}
const sandAt = z => clamp((z - 7600) / 800, 0, 1);
const TIPS = [
  'Boulders are too tall to jump. Switch lanes early.',
  'Hold jump for a higher leap; tap for a short hop.',
  'Jump again in mid-air for a double jump.',
  'Slide under the low-flying ravens.',
  'Goats charge down your lane. Dodge or jump them.',
  'Fallen palm trunks block every lane. Jump!',
  'Mint tea makes you unstoppable for a few seconds.',
  'Sliding in mid-air makes you drop faster.',
];
const SKY = [
  { p: 0.00, top: '#41558f', bot: '#f3a86f', n: 0.35 },
  { p: 0.10, top: '#3d8bd6', bot: '#cfe9f3', n: 0 },
  { p: 0.50, top: '#3d8bd6', bot: '#cfe9f3', n: 0 },
  { p: 0.60, top: '#45417e', bot: '#f2894a', n: 0.35 },
  { p: 0.70, top: '#0a0f2a', bot: '#29295a', n: 1 },
  { p: 0.90, top: '#0a0f2a', bot: '#29295a', n: 1 },
  { p: 1.00, top: '#41558f', bot: '#f3a86f', n: 0.35 },
];
function sky(ph) {
  for (let i = 0; i < SKY.length - 1; i++) {
    const a = SKY[i], b = SKY[i + 1];
    if (ph >= a.p && ph <= b.p) {
      const t = (ph - a.p) / (b.p - a.p);
      return { top: mixA(hex(a.top), hex(b.top), t), bot: mixA(hex(a.bot), hex(b.bot), t), n: lerp(a.n, b.n, t) };
    }
  }
  return { top: hex(SKY[0].top), bot: hex(SKY[0].bot), n: SKY[0].n };
}
const STARS = Array.from({ length: 90 }, (_, i) => ({ x: rnd(i, 1), y: rnd(i, 2) * 0.9, s: 0.5 + rnd(i, 3) * 1.3, tw: rnd(i, 4) * 6.28 }));

// ---------------------------------------------------------------- the trail
// Curvature and height are smooth functions of distance, so the same trail
// unrolls every run and nothing has to be stored. The first 150 m are flat.
const easeIn = z => clamp(z / 150, 0, 1);
function curveAt(z) { const n = vnoise(z / 240 + 3.7, 7); return 0.011 * n * Math.abs(n) * easeIn(z); }
function groundAt(z) { return (5.5 * vnoise(z / 170, 3) + 1.6 * vnoise(z / 55, 5)) * easeIn(z); }

// ---------------------------------------------------------------- audio
let actx = null;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
let sfxGain = null;
function sfxOut() {
  if (!sfxGain) { sfxGain = actx.createGain(); sfxGain.gain.value = 1.8; sfxGain.connect(actx.destination); }
  return sfxGain;
}
function tone(freq, dur, type = 'square', vol = 0.06, slideTo = 0, delay = 0) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gn.gain.setValueAtTime(vol, t0);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn).connect(sfxOut());
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol = 0.12) {
  if (!actx || muted) return;
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), gn = actx.createGain();
  src.buffer = buf; f.type = 'lowpass'; f.frequency.value = 900; gn.gain.value = vol;
  src.connect(f).connect(gn).connect(sfxOut()); src.start();
}
const sfx = {
  jump()  { tone(330, 0.12, 'square', 0.04, 620); },
  dbl()   { tone(520, 0.14, 'triangle', 0.06, 1100); },
  date()  { tone(880, 0.07, 'sine', 0.07, 1320); },
  water() { tone(420, 0.08, 'sine', 0.08, 820); tone(620, 0.1, 'sine', 0.07, 1100, 0.07); },
  tea()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.06, 0, i * 0.07)); },
  hit()   { noise(0.25, 0.18); tone(180, 0.28, 'sawtooth', 0.06, 60); },
  smash() { noise(0.15, 0.12); tone(300, 0.1, 'square', 0.04, 900); },
  wp()    { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.22, 'triangle', 0.05, 0, i * 0.11)); },
  low()   { tone(660, 0.08, 'sine', 0.035); },
  over()  { [440, 370, 311, 220].forEach((f, i) => tone(f, 0.25, 'triangle', 0.06, 0, i * 0.15)); },
  start() { tone(440, 0.1, 'triangle', 0.05, 880); },
  lane()  { tone(480, 0.06, 'triangle', 0.035, 720); },
  slide() { noise(0.14, 0.07); },
};

// ---------------------------------------------------------------- music
// Procedural Gnawa / Amazigh-flavoured groove: a gimbri bass riff, bendir and
// darbuka drums, qraqeb castanets in a triplet shuffle and an oud-like lead.
// Layers join as the trek goes on; nights switch to the hijaz mode and a
// breathier lead. Twelve triplet steps per bar.
const music = { on: store.get('saghro.music', true) !== false, gain: null, level: -1, nextT: 0, step: 0, phrase: null, noise: null };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const SCALE_DAY = [0, 3, 5, 7, 10];            // D F G A C — Amazigh pentatonic
const SCALE_NIGHT = [0, 1, 4, 5, 7, 8, 10];    // D Eb F# G A Bb C — hijaz
const RIFFS = [
  { 0: 38, 2: 38, 3: 41, 6: 43, 8: 41, 9: 38, 11: 36 },
  { 0: 38, 2: 38, 3: 41, 6: 43, 8: 45, 9: 43, 11: 41 },
  { 0: 33, 2: 33, 3: 36, 6: 38, 8: 36, 9: 33, 11: 34 },
  { 0: 38, 3: 36, 5: 38, 6: 41, 9: 38, 10: 36, 11: 33 },
];
const RIFF_ORDER = [0, 1, 0, 2, 0, 1, 3, 2];
function musicOut() {
  if (!music.gain) {
    music.gain = actx.createGain(); music.gain.gain.value = 0;
    music.gain.connect(actx.destination);
    const len = actx.sampleRate;
    music.noise = actx.createBuffer(1, len, actx.sampleRate);
    const d = music.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  return music.gain;
}
function env(gn, t, vol, attack, decay) {
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(vol, t + attack);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
}
function mNoise(t, dur, vol, type, freq, q = 1) {
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), gn = actx.createGain();
  src.buffer = music.noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
  env(gn, t, vol, 0.002, dur);
  src.connect(f).connect(gn).connect(musicOut());
  src.start(t, Math.random() * 0.8); src.stop(t + dur + 0.05);
}
function mOsc(t, freq, type, vol, attack, decay, cutoff = 0, cutoffEnd = 0) {
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  let node = o;
  if (cutoff) {
    const f = actx.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(cutoff, t);
    if (cutoffEnd) f.frequency.exponentialRampToValueAtTime(cutoffEnd, t + attack + decay);
    node = node.connect(f);
  }
  env(gn, t, vol, attack, decay);
  node.connect(gn).connect(musicOut());
  o.start(t); o.stop(t + attack + decay + 0.05);
  return o;
}
const inst = {
  bendir(t, acc) {
    const o = mOsc(t, 120, 'sine', 0.32 * acc, 0.003, 0.28);
    o.frequency.exponentialRampToValueAtTime(48, t + 0.16);
    mNoise(t, 0.08, 0.05 * acc, 'lowpass', 500);
  },
  tek(t, acc) { mNoise(t, 0.05, 0.1 * acc, 'bandpass', 3200, 1.4); },
  qraqeb(t, acc) { mNoise(t, 0.035, 0.05 * acc, 'highpass', 6500); mNoise(t + 0.014, 0.03, 0.035 * acc, 'highpass', 7500); },
  gimbri(t, midi, vol) {
    const f = mtof(midi);
    const a = mOsc(t, f * 1.03, 'triangle', 0.2 * vol, 0.004, 0.32);
    a.frequency.exponentialRampToValueAtTime(f, t + 0.03);
    mOsc(t, f, 'sawtooth', 0.07 * vol, 0.004, 0.22, 900, 250);
  },
  lead(t, midi, night) {
    if (night) mOsc(t, mtof(midi), 'triangle', 0.05, 0.05, 0.55, 1800);
    else mOsc(t, mtof(midi), 'sawtooth', 0.045, 0.004, 0.38, 3200, 600);
  },
  drone(t, dur) {
    for (const m of [26, 33]) {
      const o = actx.createOscillator(), f = actx.createBiquadFilter(), gn = actx.createGain();
      o.type = 'sawtooth'; o.frequency.value = mtof(m);
      f.type = 'lowpass'; f.frequency.value = 320;
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.exponentialRampToValueAtTime(0.022, t + 0.4);
      gn.gain.setValueAtTime(0.022, t + dur - 0.1);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.4);
      o.connect(f).connect(gn).connect(musicOut());
      o.start(t); o.stop(t + dur + 0.45);
    }
  },
};
function makePhrase(night) {
  const scale = night ? SCALE_NIGHT : SCALE_DAY, n = scale.length;
  const slots = night ? [0, 3, 6, 9, 12, 15, 18] : [0, 2, 3, 5, 6, 8, 9, 12, 14, 15, 17, 18];
  let deg = n + Math.floor(Math.random() * 3);
  const notes = {};
  for (const s of slots) {
    if (Math.random() < 0.2 && s !== 0) continue;
    deg = clamp(deg + [-2, -1, -1, 1, 1, 2][Math.floor(Math.random() * 6)], 0, n * 2);
    notes[s] = 62 + scale[deg % n] + 12 * Math.floor(deg / n) - 12;
  }
  notes[21] = 62; // resolve on D
  return notes;
}
function scheduleStep(step, t, m, night) {
  const s = step % 12, bar = Math.floor(step / 12), barDur = 12 * stepDur(m);
  const full = m > 400 || state === 'title', lead = m > 1000;
  if (s === 0) inst.drone(t, barDur);
  // drums
  if (s === 0) inst.bendir(t, 1);
  if (s === 6) inst.bendir(t, 0.8);
  if (s === 8 && bar % 2 === 1) inst.bendir(t, 0.5);
  if (full && (s === 3 || s === 9)) inst.tek(t, 1);
  if (full && s === 11) inst.tek(t, 0.6);
  if (full && !night && s % 3 !== 1) inst.qraqeb(t, s % 3 === 0 ? 1 : 0.6);
  // gimbri
  const riff = RIFFS[RIFF_ORDER[bar % RIFF_ORDER.length]];
  if (riff[s] !== undefined) {
    const note = night && riff[s] % 12 === 5 ? riff[s] + 1 : riff[s]; // F -> F# to fit hijaz
    inst.gimbri(t, note, night ? 0.7 : 1);
  }
  // lead: two bars of melody, two bars of rest
  if (lead) {
    const pos = (bar % 4) * 12 + s;
    if (pos === 0) music.phrase = makePhrase(night);
    if (pos < 24 && music.phrase && music.phrase[pos] !== undefined) inst.lead(t, music.phrase[pos], night);
  }
}
const stepDur = m => 60 / (96 + 30 * clamp(m / 7000, 0, 1)) / 3;
function musicTick() {
  if (!actx) return;
  musicOut();
  const want = music.on && !muted && (state === 'play' || state === 'title');
  const target = want ? (state === 'title' ? 0.18 : 0.25) : 0;
  if (target !== music.level) { music.gain.gain.setTargetAtTime(target, actx.currentTime, 0.25); music.level = target; }
  if (!want) { music.nextT = 0; return; }
  const now = actx.currentTime;
  if (music.nextT < now) music.nextT = now + 0.05;
  const m = g ? g.meters : 0, night = nightness > 0.6;
  while (music.nextT < now + 0.15) {
    scheduleStep(music.step, music.nextT, m, night);
    music.nextT += stepDur(m);
    music.step++;
  }
}
setInterval(musicTick, 25);
function toggleMusic() { music.on = !music.on; store.set('saghro.music', music.on); ensureAudio(); }

// ---------------------------------------------------------------- state
let state = 'title', stateT = 0;
let g, p;
const cam = { x: SHOULDER, y: CAM_H, z: -CAM_BACK };
const input = { kJump: false, kDuck: false };
const touches = new Map();
let tip = TIPS[0];
let nightness = 0;

function newGame() {
  g = {
    t: 0, z: 0, speed: 8, meters: 0, dates: 0, bonus: 0,
    water: 100, hearts: 3, invuln: 0, shield: 0,
    obs: [], items: [], parts: [],
    nextRow: 70, waterT: 6, teaT: 38, lowT: 0, dustT: 0,
    wp: 0, lastWp: WAYPOINTS[0].name, banner: null,
    phase: 0.06, shake: 0, reason: '', newBest: false, bgX: 0,
  };
  p = { lane: 0, x: 0, y: 0, vy: 0, onGround: true, jumps: 0, hold: false, holdT: 0, duck: false, slideT: 0, buffer: 0, run: 0, lean: 0 };
  cam.x = SHOULDER; cam.y = groundAt(0) + CAM_H; cam.z = -CAM_BACK;
}
const score = () => Math.floor(g.meters) + g.dates * 10 + g.bonus;
const difficulty = () => clamp(g.meters / 7000, 0, 1);

function startGame() {
  newGame();
  state = 'play'; stateT = 0;

    case 'scorpion': o.w = 0.4; o.d = 0.35; o.h = 0.3; break;

// ---------------------------------------------------------------- update
function update(dt) {

    const d = difficulty();

  }

        grav: 2, size: rand(0.05, 0.09), life: 0.45, max: 0.45, color: sandAt(g.z) > 0.5 ? '#ecc994' : '#d9b588',

    }
  }

  ellipse(mb.x + 12, mb.y + 22, 4, 3, -0.4); ctx.fill();
  ellipse(mb.x + 22, mb.y + 20, 4, 3, -0.4); ctx.fill();
  ctx.fillRect(mb.x + 14.5, mb.y + 9, 2, 13); ctx.fillRect(mb.x + 24.5, mb.y + 7, 2, 13);
  ctx.beginPath(); ctx.moveTo(mb.x + 15.5, mb.y + 10); ctx.lineTo(mb.x + 25.5, mb.y + 8); ctx.stroke();
  if (!music.on || muted) {
    ctx.strokeStyle = '#e8504a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(mb.x + 7, mb.y + 26); ctx.lineTo(mb.x + 27, mb.y + 6); ctx.stroke();
  }
  if (showPause) {
    const b = pauseBtn();
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; rr(b.x, b.y, b.w, b.h, 8); ctx.fill();
    ctx.fillStyle = '#f6e3c3'; ctx.fillRect(b.x + 11, b.y + 9, 4, 14); ctx.fillRect(b.x + 18, b.y + 9, 4, 14);
  }
}
function drawHeart(x, y, full) {
  ctx.fillStyle = full ? '#e8504a' : 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.moveTo(x, y + 4);
  ctx.bezierCurveTo(x - 7, y - 1, x - 3, y - 7, x, y - 3);
  ctx.bezierCurveTo(x + 3, y - 7, x + 7, y - 1, x, y + 4);
  ctx.fill();
}
function drawHUD() {
  text(score().toLocaleString('en-US'), 16, 24, 24, '#fff4dc', 'left');
  text(`${(g.meters / 1000).toFixed(2)} km  ·  ${g.dates} dates`, 16, 46, 12, '#f6e3c3', 'left');
  // water
  const low = g.water < 25, flash = low && Math.floor(g.t * 4) % 2 === 0;
  ctx.fillStyle = '#4fb3e8';
  ctx.beginPath(); ctx.moveTo(22, 58); ctx.quadraticCurveTo(28, 66, 22, 70); ctx.quadraticCurveTo(16, 66, 22, 58); ctx.fill();
  ellipse(22, 66.5, 4.2, 4); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(32, 60, 110, 10, 5); ctx.fill();
  ctx.fillStyle = flash ? '#ff5a4a' : '#4fb3e8'; rr(32, 60, Math.max(10, 110 * g.water / 100), 10, 5); ctx.fill();
  if (low) text('Low water!', 150, 65, 11, flash ? '#ff8a7a' : '#ffd0c8', 'left');
  for (let i = 0; i < 3; i++) drawHeart(22 + i * 18, 84, i < g.hearts);
  // next waypoint
  const nx = waypoint(g.wp);
  const dist = Math.max(0, nx.m - g.meters) / 1000;
  text(`Next: ${nx.name} · ${dist.toFixed(1)} km`, W / 2, 22, 12, '#f6e3c3', 'center');
  // banner
  if (g.banner) {
    const b = g.banner, a = clamp(Math.min(b.t * 3, (b.dur - b.t) * 2), 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    const bw = 300, by = 52 - (1 - a) * 8;
    ctx.fillStyle = 'rgba(30,18,26,0.55)'; rr(W / 2 - bw / 2, by, bw, 62, 12); ctx.fill();
    text(b.name, W / 2, by + 24, 26, '#ffe2b0', 'center', SERIF, '700');
    text(b.sub, W / 2, by + 48, 12, '#f6e3c3', 'center');
    ctx.restore();
  }
  // touch hint
  if (isTouch && stateT < 5 && state === 'play') {
    ctx.save(); ctx.globalAlpha = clamp(5 - stateT, 0, 1) * 0.85;
    ctx.fillStyle = 'rgba(30,18,26,0.45)'; rr(W / 2 - 170, H - 66, 340, 46, 10); ctx.fill();
    text('Swipe ← → to change lanes', W / 2, H - 53, 13, '#fff4dc');
    text('Tap or swipe ↑ to jump · swipe ↓ to slide', W / 2, H - 33, 13, '#fff4dc');
    ctx.restore();
  }
}
function overlay(alpha) { ctx.fillStyle = `rgba(20,12,22,${alpha})`; ctx.fillRect(0, 0, W, H); }
function drawTitle() {
  overlay(0.35);
  text('SAGHRO TREK 3D', W / 2, 70, 44, '#ffe2b0', 'center', SERIF, '700');
  text('Over the shoulder, over the passes', W / 2, 105, 15, '#f6e3c3');
  const bw = Math.min(W - 40, 450), bx = W / 2 - bw / 2;
  ctx.fillStyle = 'rgba(30,18,26,0.55)'; rr(bx, 126, bw, 104, 12); ctx.fill();
  if (isTouch) {
    text('Swipe left or right to change lanes.', W / 2, 146, 13, '#fff4dc');
    text('Tap or swipe up to jump (again to double-jump). Swipe down to slide.', W / 2, 166, 12, '#fff4dc');
  } else {
    text('← → change lanes  ·  Space / ↑ jump, press again to double-jump', W / 2, 146, 13, '#fff4dc');
    text('↓ slide  ·  P pause  ·  M sound  ·  N music', W / 2, 166, 13, '#fff4dc');
  }
  text('Boulders block a lane: go around. Ravens fly low: slide under.', W / 2, 190, 12, '#f1c27d');
  text('Grab water before you run dry · mint tea = invincibility', W / 2, 210, 12, '#ffd36b');
  const pulse = 0.6 + 0.4 * Math.sin(stateT * 4);
  ctx.save(); ctx.globalAlpha = pulse;
  text(isTouch ? 'Tap to start' : 'Press Space or click to start', W / 2, 256, 18, '#ffffff');
  ctx.restore();
  if (best.score > 0) text(`Best: ${best.score.toLocaleString('en-US')}  ·  ${best.km.toFixed(2)} km`, W / 2, H - 22, 12, '#f6e3c3');
}
function drawOver() {
  overlay(Math.min(0.5, stateT));
  if (stateT < 0.4) return;
  const bw = Math.min(W - 40, 360), bx = W / 2 - bw / 2, by = 46;
  ctx.fillStyle = 'rgba(30,18,26,0.75)'; rr(bx, by, bw, 236, 14); ctx.fill();
  text('Trek over', W / 2, by + 30, 30, '#ffe2b0', 'center', SERIF, '700');
  const why = g.reason === 'thirst' ? `You ran out of water past ${g.lastWp}.` : `One tumble too many past ${g.lastWp}.`;
  text(why, W / 2, by + 60, 13, '#f6e3c3');
  text(score().toLocaleString('en-US'), W / 2, by + 98, 36, '#ffffff');
  text(`${(g.meters / 1000).toFixed(2)} km  ·  ${g.dates} dates`, W / 2, by + 130, 13, '#f6e3c3');
  if (g.newBest) text('New personal best!', W / 2, by + 154, 14, '#ffd36b');
  else text(`Best: ${best.score.toLocaleString('en-US')}`, W / 2, by + 154, 13, '#c9b49a');
  text(tip, W / 2, by + 182, 11, '#c9b49a');
  if (stateT > 0.7) {
    ctx.save(); ctx.globalAlpha = 0.6 + 0.4 * Math.sin(stateT * 4);
    text(isTouch ? 'Tap to hike again' : 'Space or click to hike again', W / 2, by + 212, 16, '#ffffff');
    ctx.restore();
  }
}
function drawPaused() {
  overlay(0.45);
  text('Paused', W / 2, H / 2 - 16, 34, '#ffe2b0', 'center', SERIF, '700');
  text(isTouch ? 'Tap to resume' : 'Press P, Space or click to resume', W / 2, H / 2 + 22, 14, '#f6e3c3');
}

// ---------------------------------------------------------------- render
function render() {
  ctx.setTransform(cvs.width / W, 0, 0, cvs.height / H, 0, 0);
  ctx.save();
  if (g.shake > 0) ctx.translate((Math.random() - 0.5) * 8 * g.shake / 0.35, (Math.random() - 0.5) * 6 * g.shake / 0.35);
  const sk = sky(g.phase), n = sk.n;
  nightness = n;

  const gr = ctx.createLinearGradient(0, 0, 0, HOR);
  gr.addColorStop(0, css(sk.top)); gr.addColorStop(1, css(sk.bot));
  ctx.fillStyle = gr; ctx.fillRect(-10, -10, W + 20, H + 20);
  if (n > 0.05) {
    for (const s of STARS) {
      ctx.globalAlpha = n * (0.55 + 0.45 * Math.sin(g.t * 2 + s.tw));
      ctx.fillStyle = '#fff8e6'; ctx.fillRect(((s.x * W - g.bgX * 0.4) % W + W) % W, s.y * HOR, s.s * 1.3, s.s * 1.3);
    }
    ctx.globalAlpha = 1;
  }
  // sun & moon
  const ph = g.phase;
  if (ph < 0.66) {
    const u = ph / 0.66, sx = W * (0.08 + 0.84 * u), sy = HOR - 10 - Math.sin(u * Math.PI) * (HOR - 66);
    ctx.fillStyle = 'rgba(255,230,160,0.25)'; ellipse(sx, sy, 30, 30); ctx.fill();
    ctx.fillStyle = '#fff1c4'; ellipse(sx, sy, 16, 16); ctx.fill();
  }
  const mp = (ph - 0.62 + 1) % 1;
  if (mp < 0.42) {
    const u = mp / 0.42, mx = W * (0.08 + 0.84 * u), my = HOR - 10 - Math.sin(u * Math.PI) * (HOR - 66);
    ctx.fillStyle = '#f4f1e2'; ellipse(mx, my, 12, 12); ctx.fill();
    ctx.fillStyle = css(sk.top); ellipse(mx + 5, my - 3, 10, 10); ctx.fill();
  }
  const sand = sandAt(g.z);
  const nearRidge = mixA(mixA(hex('#a8705a'), hex('#d9a466'), sand), sk.bot, 0.2);
  drawRidge(g.bgX * 0.6, HOR - 6, 70, 0.006, 1.7, css(mixA(hex('#9d7f9a'), sk.bot, 0.35)));
  drawRidge(g.bgX, HOR + 2, 38, 0.011, 4.2, css(nearRidge));

  drawWorld(mixA(nearRidge, sk.bot, 0.4)); // distant ground fades into the hills

  if (n > 0) {
    ctx.fillStyle = `rgba(12,14,40,${0.45 * n})`; ctx.fillRect(-10, -10, W + 20, H + 20);
    // headlamp: a pool of light on the trail ahead
    if (n > 0.3 && state !== 'over') {
      const near = proj(p.x, 0, g.z + 5), far = proj(p.x, 0, g.z + 16), head = proj(p.x, p.y + 1.6, g.z);
      if (near && far && head) {
        const cx = (near.sx + far.sx) / 2, cy = (near.sy + far.sy) / 2, rx = 2.6 * (near.s + far.s) / 2, ry = Math.max(4, (near.sy - far.sy) / 2);
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `rgba(255,220,150,${0.07 * n})`;
        ctx.beginPath(); ctx.moveTo(head.sx, head.sy); ctx.lineTo(cx - rx, cy); ctx.lineTo(cx + rx, cy); ctx.closePath(); ctx.fill();
        ctx.translate(cx, cy); ctx.scale(1, ry / rx);
        const lg = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
        lg.addColorStop(0, `rgba(255,220,150,${0.3 * n})`); lg.addColorStop(1, 'rgba(255,220,150,0)');
        ctx.fillStyle = lg; ellipse(0, 0, rx, rx); ctx.fill();
        ctx.restore();
      }
    }
  }
  ctx.restore();

  if (state === 'play' || state === 'paused' || state === 'over') drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'paused') drawPaused();
  if (state === 'over') drawOver();
  drawButtons();
}

// ---------------------------------------------------------------- input
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
const DUCK_KEYS = ['ArrowDown', 'KeyS'];
const LEFT_KEYS = ['ArrowLeft', 'KeyA'];
const RIGHT_KEYS = ['ArrowRight', 'KeyD'];
const GAME_KEYS = [...JUMP_KEYS, ...DUCK_KEYS, ...LEFT_KEYS, ...RIGHT_KEYS];
window.addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  ensureAudio();
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (e.code === 'KeyN') { toggleMusic(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') pause(); else if (state === 'paused') resume(); return; }
  if (JUMP_KEYS.includes(e.code) || e.code === 'Enter') {
    if (e.repeat) return;
    if (state === 'title' || state === 'over') { tryStart(); return; }
    if (state === 'paused') { resume(); return; }
    input.kJump = true; jumpPress(false);
  }
  if (e.repeat) return;
  if (LEFT_KEYS.includes(e.code)) steer(-1);
  if (RIGHT_KEYS.includes(e.code)) steer(1);
  if (DUCK_KEYS.includes(e.code) && state === 'play') { input.kDuck = true; slide(0.3); }
});
window.addEventListener('keyup', e => {
  if (JUMP_KEYS.includes(e.code) || e.code === 'Enter') input.kJump = false;
  if (DUCK_KEYS.includes(e.code)) input.kDuck = false;
});
function toLogical(e) {
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
const inBtn = (pt, b) => pt.x >= b.x - 6 && pt.x <= b.x + b.w + 6 && pt.y >= b.y - 6 && pt.y <= b.y + b.h + 6;
// A drag past a few pixels is a swipe; a press that doesn't move is a tap (jump).
cvs.addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio(); cvs.focus();
  if (e.pointerType !== 'mouse') isTouch = true;
  const pt = toLogical(e);
  if (inBtn(pt, muteBtn())) { toggleMute(); return; }
  if (inBtn(pt, musicBtn())) { toggleMusic(); return; }
  if (state === 'play' && inBtn(pt, pauseBtn())) { pause(); return; }
  if (state === 'title' || state === 'over') { tryStart(); return; }
  if (state === 'paused') { resume(); return; }
  try { cvs.setPointerCapture(e.pointerId); } catch (_) {}
  touches.set(e.pointerId, { x: pt.x, y: pt.y, done: false });
});
cvs.addEventListener('pointermove', e => {
  const tc = touches.get(e.pointerId);
  if (!tc || tc.done) return;
  const pt = toLogical(e), dx = pt.x - tc.x, dy = pt.y - tc.y;
  if (dx * dx + dy * dy < 22 * 22) return;
  tc.done = true;
  if (Math.abs(dx) > Math.abs(dy)) steer(Math.sign(dx));
  else if (dy < 0) jumpPress(true);
  else slide(0.7);
});
cvs.addEventListener('pointerup', e => {
  const tc = touches.get(e.pointerId);
  touches.delete(e.pointerId);
  if (tc && !tc.done) jumpPress(true);
});
cvs.addEventListener('pointercancel', e => touches.delete(e.pointerId));
cvs.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', pause);

// ---------------------------------------------------------------- loop
newGame();
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000));
  last = now;
  if (state === 'paused') stateT += dt; else update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// The service worker at the repo root caches both games for offline play.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('../sw.js').catch(() => {});
}
})();
</script>
</body>
