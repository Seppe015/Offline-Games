<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1a24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saghro Trek">
<title>Saghro Trek</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #1d121a;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; }
  #rotate {
    display: none; position: fixed; left: 0; right: 0; bottom: 24px;
    text-align: center; color: #e9cfa8; opacity: .75;
    font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    pointer-events: none;
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="rotate">Turn your phone sideways for a wider trail ↻</div>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- setup
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const H = 360, GROUND = 296, MIN_W = 480, MAX_W = 1000;
const CYCLE = 150;          // seconds for a full day/night cycle
const PX_PER_M = 40;        // world pixels per metre
let W = 640;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vh / H, vw / MIN_W);
  W = Math.round(Math.min(MAX_W, vw / scale));
  cvs.style.width = (W * scale) + 'px';
  cvs.style.height = (H * scale) + 'px';
  cvs.width = Math.round(W * scale * dpr);
  cvs.height = Math.round(H * scale * dpr);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let best = store.get('saghro.best', null);
if (!best || typeof best.score !== 'number') best = { score: 0, km: 0 };
let muted = store.get('saghro.muted', false) === true;
let isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

// ---------------------------------------------------------------- helpers
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
function rnd(i, k) { // deterministic hash -> [0,1)
  let h = Math.imul(i ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(k + 1, 0xc2b2ae35);
  h ^= h >>> 13; h = Math.imul(h, 0x27d4eb2f); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}
const hexCache = new Map();
function hex(c) {
  let v = hexCache.get(c);
  if (!v) { v = [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); hexCache.set(c, v); }
  return v;
}
function mix(a, b, t) {
  const A = hex(a), B = hex(b);
  return `rgb(${A[0] + (B[0] - A[0]) * t | 0},${A[1] + (B[1] - A[1]) * t | 0},${A[2] + (B[2] - A[2]) * t | 0})`;
}
function weighted(list, r = Math.random()) {
  let total = 0; for (const [, w] of list) total += w;
  r *= total;
  for (const [v, w] of list) { if ((r -= w) < 0) return v; }
  return list[list.length - 1][0];
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); }
function text(str, x, y, size, color, align = 'center', font = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif', weight = '600') {
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillText(str, x + 1, y + 1.5);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
const SERIF = 'Georgia, "Times New Roman", serif';

// ---------------------------------------------------------------- world data
const WAYPOINTS = [
  { m: 0,     name: 'Tagdilt',          sub: 'The trek begins. Mind your water.' },
  { m: 600,   name: "Tizi n'Tazazert",  sub: 'A windswept mountain pass' },
  { m: 1400,  name: 'Jbel Kouaouch',    sub: 'Summit country' },
  { m: 2500,  name: 'Igli',             sub: 'A quiet valley village' },
  { m: 3800,  name: "Bab n'Ali",        sub: 'The great rock towers' },
  { m: 5500,  name: "N'Kob",            sub: 'Trek complete! Keep walking…' },
  { m: 8000,  name: 'Tazzarine',        sub: 'South into the open desert' },
  { m: 11000, name: 'Erg Chebbi',       sub: 'Dunes on the horizon' },
];
function waypoint(i) {
  if (i < WAYPOINTS.length) return WAYPOINTS[i];
  const m = 11000 + (i - WAYPOINTS.length + 1) * 4000;
  return { m, name: `Deep Sahara · ${m / 1000} km`, sub: 'Nothing but sand and stars' };
}
function region(m) { return m < 3200 ? 'mtn' : m < 5200 ? 'bab' : m < 7600 ? 'oasis' : 'desert'; }
const SCENERY = {
  mtn:    [['empty', 35], ['spires', 45], ['kasbah', 10], ['palms', 10]],
  bab:    [['empty', 18], ['spires', 77], ['kasbah', 5]],
  oasis:  [['empty', 20], ['spires', 20], ['kasbah', 25], ['palms', 35]],
  desert: [['empty', 25], ['dune', 55], ['palms', 10], ['spires', 10]],
};
const TIPS = [
  'Hold jump for a higher leap; tap for a short hop.',
  'Jump again in mid-air for a double jump.',
  'Duck under the low-flying ravens.',
  'Mint tea makes you unstoppable for a few seconds.',
  'Goats run at you, so jump a little early.',
  'Ducking in mid-air makes you drop faster.',
  'Water bottles sometimes float. Hop for them.',
];
const SKY = [
  { p: 0.00, top: '#41558f', bot: '#f3a86f', n: 0.35 },
  { p: 0.10, top: '#3d8bd6', bot: '#cfe9f3', n: 0 },
  { p: 0.50, top: '#3d8bd6', bot: '#cfe9f3', n: 0 },
  { p: 0.60, top: '#45417e', bot: '#f2894a', n: 0.35 },
  { p: 0.70, top: '#0a0f2a', bot: '#29295a', n: 1 },
  { p: 0.90, top: '#0a0f2a', bot: '#29295a', n: 1 },
  { p: 1.00, top: '#41558f', bot: '#f3a86f', n: 0.35 },
];
function sky(ph) {
  for (let i = 0; i < SKY.length - 1; i++) {
    const a = SKY[i], b = SKY[i + 1];
    if (ph >= a.p && ph <= b.p) {
      const t = (ph - a.p) / (b.p - a.p);
      return { top: mix(a.top, b.top, t), bot: mix(a.bot, b.bot, t), botHex: t < 0.5 ? a.bot : b.bot, n: lerp(a.n, b.n, t) };
    }
  }
  return { top: SKY[0].top, bot: SKY[0].bot, botHex: SKY[0].bot, n: SKY[0].n };
}
const STARS = Array.from({ length: 90 }, (_, i) => ({ x: rnd(i, 1), y: rnd(i, 2) * 0.62, s: 0.5 + rnd(i, 3) * 1.3, tw: rnd(i, 4) * 6.28 }));

// ---------------------------------------------------------------- audio
let actx = null;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type = 'square', vol = 0.06, slideTo = 0, delay = 0) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gn.gain.setValueAtTime(vol, t0);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol = 0.12) {
  if (!actx || muted) return;
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), gn = actx.createGain();
  src.buffer = buf; f.type = 'lowpass'; f.frequency.value = 900; gn.gain.value = vol;
  src.connect(f).connect(gn).connect(actx.destination); src.start();
}
const sfx = {
  jump()  { tone(330, 0.12, 'square', 0.04, 620); },
  dbl()   { tone(520, 0.14, 'triangle', 0.06, 1100); },
  date()  { tone(880, 0.07, 'sine', 0.07, 1320); },
  water() { tone(420, 0.08, 'sine', 0.08, 820); tone(620, 0.1, 'sine', 0.07, 1100, 0.07); },
  tea()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.06, 0, i * 0.07)); },
  hit()   { noise(0.25, 0.18); tone(180, 0.28, 'sawtooth', 0.06, 60); },
  smash() { noise(0.15, 0.12); tone(300, 0.1, 'square', 0.04, 900); },
  wp()    { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.22, 'triangle', 0.05, 0, i * 0.11)); },
  low()   { tone(660, 0.08, 'sine', 0.035); },
  over()  { [440, 370, 311, 220].forEach((f, i) => tone(f, 0.25, 'triangle', 0.06, 0, i * 0.15)); },
  start() { tone(440, 0.1, 'triangle', 0.05, 880); },
};

// ---------------------------------------------------------------- state
let state = 'title', stateT = 0;
let g, p;
const tileCache = new Map();
const input = { kJump: false, kDuck: false };
const pointers = new Map();
let tip = TIPS[0];
let nightness = 0;

function newGame() {
  g = {
    t: 0, scroll: 0, speed: 110, meters: 0, dates: 0, bonus: 0,
    water: 100, hearts: 3, invuln: 0, shield: 0,
    obs: [], items: [], parts: [],
    distSince: 0, nextGap: 520, waterT: 6, teaT: 38, lowT: 0, dustT: 0,
    wp: 0, lastWp: WAYPOINTS[0].name, banner: null,
    phase: 0.06, shake: 0, reason: '', newBest: false, hist: [],
  };
  p = { x: 120, y: GROUND, vy: 0, onGround: true, jumps: 0, duck: false, hold: false, buffer: 0, coyote: 0, run: 0 };
  tileCache.clear();
}
const score = () => Math.floor(g.meters) + g.dates * 10 + g.bonus;
const difficulty = () => clamp(g.meters / 7000, 0, 1);

function startGame() {
  newGame();
  state = 'play'; stateT = 0;
  pointers.clear();
  sfx.start();
}
function tryStart() {
  if (state === 'over' && stateT < 0.7) return;
  startGame();
}
function pause() { if (state === 'play') { state = 'paused'; input.kJump = input.kDuck = false; pointers.clear(); } }
function resume() { if (state === 'paused') state = 'play'; }
function toggleMute() { muted = !muted; store.set('saghro.muted', muted); if (!muted) { ensureAudio(); tone(660, 0.08, 'sine', 0.05); } }

function gameOver(reason) {
  state = 'over'; stateT = 0;
  g.reason = reason;
  const s = score(), km = g.meters / 1000;
  if (s > best.score) { best.score = s; g.newBest = true; }
  if (km > best.km) best.km = km;
  store.set('saghro.best', best);
  tip = TIPS[Math.floor(Math.random() * TIPS.length)];
  sfx.over();
}

// ---------------------------------------------------------------- spawning
function rockPts(w, h) {
  const pts = [[0, 0]], n = 6;
  for (let k = 1; k < n; k++) {
    const a = Math.PI - (k / n) * Math.PI;
    pts.push([w / 2 + Math.cos(a) * w / 2 * rand(0.8, 1), -Math.sin(a) * h * rand(0.8, 1)]);
  }
  pts.push([w, 0]);
  // make sure the tallest point reaches h so the hitbox is honest
  let top = 1; for (let k = 1; k < pts.length; k++) if (pts[k][1] < pts[top][1]) top = k;
  pts[top][1] = -h;
  return pts;
}
function addObs(type, x) {
  const d = difficulty();
  const o = { type, x, vx: 0, t: Math.random() * 10, hit: false, dead: false };
  switch (type) {
    case 'rock':     o.w = rand(24, 44); o.h = rand(18, 30 + d * 8); o.pts = rockPts(o.w, o.h); break;
    case 'bush':     o.w = rand(30, 38); o.h = rand(22, 28); o.seed = Math.random() * 1e6 | 0; break;
    case 'scorpion': o.w = 30; o.h = 13; o.vx = 20; break;
    case 'goat':     o.w = 34; o.h = 30; o.vx = rand(70, 110); break;
    case 'raven':    o.w = 28; o.h = 16; o.vx = 50; break;
  }
  o.y = type === 'raven' ? (Math.random() < 0.75 ? GROUND - 44 : GROUND - 92) : GROUND - o.h;
  // Moving obstacles start further right so they reach the hiker at the same
  // moment a still obstacle spawned now would, keeping the spacing fair.
  o.x += (W - 80) * o.vx / g.speed;
  g.obs.push(o);
  return o;
}
function addItem(type, x, y) {
  g.items.push({ type, x, y, r: type === 'date' ? 7 : 10, t: Math.random() * 6 });
}
function spawnObstacle() {
  const m = g.meters, d = difficulty(), x = W + 40;
  const pool = [['rock', 3], ['bush', 2], ['scorpion', 2]];
  if (m > 500)  pool.push(['goat', 1.5 + d]);
  if (m > 1100) pool.push(['raven', 1.2 + d * 1.5]);
  if (m > 2000) pool.push(['pair', 1 + d * 1.5]);
  const type = weighted(pool);
  if (type === 'pair') {
    const a = addObs('rock', x);
    addObs(Math.random() < 0.5 ? 'rock' : 'bush', x + a.w + rand(4, 14));
  } else {
    addObs(type, x);
  }
  if (type !== 'raven' && type !== 'goat' && Math.random() < 0.3) {
    const hs = [46, 70, 80, 70, 46];
    hs.forEach((h, i) => addItem('date', x + 18 + (i - 2) * 24, GROUND - h));
  }
}
function spawnPickups(gap) {
  const x = W + 40 + gap / 2;
  if (g.waterT <= 0) {
    addItem('water', x, Math.random() < 0.6 ? GROUND - 16 : GROUND - 72);
    g.waterT = rand(7, 11);
  } else if (g.teaT <= 0) {
    addItem('tea', x, GROUND - 76);
    g.teaT = rand(35, 55);
  } else if (Math.random() < 0.55) {
    const n = 4 + Math.floor(Math.random() * 3), high = Math.random() < 0.35;
    for (let i = 0; i < n; i++) addItem('date', x + (i - (n - 1) / 2) * 22, high ? GROUND - 62 : GROUND - 16);
  }
}
function burst(x, y, n, color, spd = 160, grav = 500, size = 3, life = 0.6) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    g.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * 0.3, grav, size: size * rand(0.6, 1.2), life, max: life, color });
  }
}

// ---------------------------------------------------------------- update
function update(dt) {
  stateT += dt;
  const active = state === 'play';
  g.t += dt;
  if (state === 'title') g.speed = 110;
  if (state === 'over') g.speed = Math.max(0, g.speed - 700 * dt);
  if (active) {
    const d = difficulty();
    g.speed = Math.min(680, 270 + 310 * (1 - (1 - d) * (1 - d)) + Math.max(0, g.meters - 7000) * 0.01);
  }

  g.scroll += g.speed * dt;
  g.phase = (g.phase + dt / CYCLE) % 1;
  if (g.speed > 0) p.run += dt * (g.speed / 22 + 2);
  g.shake = Math.max(0, g.shake - dt);

  if (active) {
    p.hold = input.kJump; p.duck = input.kDuck;
    for (const role of pointers.values()) { if (role === 'jump') p.hold = true; else p.duck = true; }

    // jumping
    p.buffer -= dt; p.coyote -= dt;
    if (p.onGround) p.coyote = 0.09;
    if (p.buffer > 0) {
      if (p.onGround || p.coyote > 0) {
        p.vy = -720; p.onGround = false; p.coyote = 0; p.jumps = 1; p.buffer = 0;
        sfx.jump(); burst(p.x - 4, GROUND - 2, 5, '#d8b483', 70, 200, 3, 0.4);
      } else if (p.jumps < 2) {
        p.vy = -640; p.jumps = 2; p.buffer = 0;
        sfx.dbl(); burst(p.x, p.y - 4, 8, '#fff2c8', 90, 0, 2, 0.35);
      }
    }
  }
  if (state !== 'title') {
    let grav = 2300;
    if (!p.hold && p.vy < 0) grav *= 1.9;
    if (p.duck && !p.onGround) grav *= 2.2;
    p.vy += grav * dt; p.y += p.vy * dt;
    if (p.y >= GROUND) {
      if (!p.onGround) burst(p.x, GROUND - 2, 6, '#d8b483', 80, 200, 3, 0.4);
      p.y = GROUND; p.vy = 0; p.onGround = true; p.jumps = 0;
    }
  }
  g.hist.push({ t: g.t, y: p.y });
  while (g.hist.length > 2 && g.hist[0].t < g.t - 1.2) g.hist.shift();

  // move everything
  for (const o of g.obs) { o.x -= (g.speed + (active ? o.vx : 0)) * dt; o.t += dt; }
  for (const it of g.items) { it.x -= g.speed * dt; it.t += dt; }
  for (const q of g.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.grav * dt; q.life -= dt; }
  g.obs = g.obs.filter(o => !o.dead && o.x + o.w > -80);
  g.items = g.items.filter(it => !it.dead && it.x > -40);
  g.parts = g.parts.filter(q => q.life > 0);
  if (g.banner) { g.banner.t += dt; if (g.banner.t > g.banner.dur) g.banner = null; }

  // running dust
  if (g.speed > 0 && p.onGround && state !== 'over') {
    g.dustT -= dt;
    if (g.dustT <= 0) {
      g.dustT = 0.09;
      g.parts.push({ x: p.x - 6, y: GROUND - 2, vx: -g.speed * 0.25 - 20, vy: -rand(10, 40), grav: 60, size: rand(2, 3.5), life: 0.45, max: 0.45, color: '#d9b588' });
    }
  }

  if (!active) return;

  // distance, waypoints
  g.meters += g.speed * dt / PX_PER_M;
  const wp = waypoint(g.wp);
  if (g.meters >= wp.m) {
    g.banner = { name: wp.name, sub: wp.sub, t: 0, dur: 3.4 };
    g.lastWp = wp.name;
    if (g.wp > 0) { g.bonus += 100; sfx.wp(); }
    g.wp++;
  }

  // spawning
  g.waterT -= dt; g.teaT -= dt;
  g.distSince += g.speed * dt;
  if (g.distSince >= g.nextGap) {
    g.distSince = 0;
    spawnObstacle();
    const d = difficulty();
    const minGap = g.speed * 0.85 + 90;
    g.nextGap = rand(minGap, minGap + 420 - 220 * d);
    spawnPickups(g.nextGap);
  }

  // water
  g.water -= (1.8 + 1.4 * difficulty()) * dt * (g.shield > 0 ? 0 : 1);
  if (g.water < 25) {
    g.lowT -= dt;
    if (g.lowT <= 0) { sfx.low(); g.lowT = 1.5; }
  }
  if (g.water <= 0) { g.water = 0; gameOver('thirst'); return; }

  g.invuln = Math.max(0, g.invuln - dt);
  g.shield = Math.max(0, g.shield - dt);

  // collisions
  const ph = (p.duck && p.onGround) ? 22 : 38;
  const pb = { x: p.x - 9, y: p.y - ph + 3, w: 18, h: ph - 3 };
  for (const o of g.obs) {
    if (o.hit || o.dead) continue;
    const pad = o.type === 'raven' ? 2 : 3;
    if (pb.x < o.x + o.w - pad && pb.x + pb.w > o.x + pad && pb.y < o.y + o.h - 1 && pb.y + pb.h > o.y + pad) {
      if (g.shield > 0) {
        o.dead = true; g.bonus += 15; sfx.smash();
        burst(o.x + o.w / 2, o.y + o.h / 2, 14, o.type === 'bush' ? '#7b7d3e' : '#5a4740', 220, 700, 3.5, 0.7);
      } else if (g.invuln <= 0) {
        o.hit = true; g.hearts--; g.invuln = 1.5; g.shake = 0.35;
        sfx.hit(); burst(p.x, p.y - 20, 12, '#e8d6a8', 180, 600, 3, 0.6);
        if (g.hearts <= 0) { gameOver('tumble'); return; }
      }
    }
  }
  const cx = p.x, cy = p.y - ph / 2;
  for (const it of g.items) {
    if (it.dead) continue;
    const dx = it.x - cx, dy = it.y + Math.sin(it.t * 3) * 3 - cy;
    if (dx * dx + dy * dy < (it.r + 15) * (it.r + 15)) {
      it.dead = true;
      if (it.type === 'date') { g.dates++; sfx.date(); burst(it.x, it.y, 5, '#f1c27d', 90, 100, 2, 0.4); }

    ctx.beginPath(); ctx.arc(m.x + 18, m.y + 16, 8, -0.9, 0.9); ctx.stroke();
  }
  if (showPause) {
    const b = pauseBtn();
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; rr(b.x, b.y, b.w, b.h, 8); ctx.fill();
    ctx.fillStyle = '#f6e3c3'; ctx.fillRect(b.x + 11, b.y + 9, 4, 14); ctx.fillRect(b.x + 18, b.y + 9, 4, 14);
  }
}
function drawHeart(x, y, full) {
  ctx.fillStyle = full ? '#e8504a' : 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.moveTo(x, y + 4);
  ctx.bezierCurveTo(x - 7, y - 1, x - 3, y - 7, x, y - 3);
  ctx.bezierCurveTo(x + 3, y - 7, x + 7, y - 1, x, y + 4);
  ctx.fill();
}
function drawHUD() {
  text(score().toLocaleString('en-US'), 16, 24, 24, '#fff4dc', 'left');
  text(`${(g.meters / 1000).toFixed(2)} km  ·  ${g.dates} dates`, 16, 46, 12, '#f6e3c3', 'left');
  // water
  const low = g.water < 25, flash = low && Math.floor(g.t * 4) % 2 === 0;
  ctx.fillStyle = '#4fb3e8';
  ctx.beginPath(); ctx.moveTo(22, 58); ctx.quadraticCurveTo(28, 66, 22, 70); ctx.quadraticCurveTo(16, 66, 22, 58); ctx.fill();
  ellipse(22, 66.5, 4.2, 4); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(32, 60, 110, 10, 5); ctx.fill();
  ctx.fillStyle = flash ? '#ff5a4a' : '#4fb3e8'; rr(32, 60, Math.max(10, 110 * g.water / 100), 10, 5); ctx.fill();
  if (low) text('Low water!', 150, 65, 11, flash ? '#ff8a7a' : '#ffd0c8', 'left');
  for (let i = 0; i < 3; i++) drawHeart(22 + i * 18, 84, i < g.hearts);
  // next waypoint
  const nx = waypoint(g.wp);
  const dist = Math.max(0, nx.m - g.meters) / 1000;
  text(`Next: ${nx.name} · ${dist.toFixed(1)} km`, W / 2, 22, 12, '#f6e3c3', 'center');
  // banner
  if (g.banner) {
    const b = g.banner, a = clamp(Math.min(b.t * 3, (b.dur - b.t) * 2), 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    const bw = 300, by = 70 - (1 - a) * 8;
    ctx.fillStyle = 'rgba(30,18,26,0.55)'; rr(W / 2 - bw / 2, by, bw, 62, 12); ctx.fill();
    text(b.name, W / 2, by + 24, 26, '#ffe2b0', 'center', SERIF, '700');
    text(b.sub, W / 2, by + 48, 12, '#f6e3c3', 'center');
    ctx.restore();
  }
  // touch hint
  if (isTouch && stateT < 5) {
    ctx.save(); ctx.globalAlpha = clamp(5 - stateT, 0, 1) * 0.8;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(W * 0.35, 110); ctx.lineTo(W * 0.35, H - 20); ctx.stroke(); ctx.setLineDash([]);
    text('HOLD here: duck', W * 0.175, H - 30, 13, '#fff4dc');
    text('TAP here: jump (again for double)', W * 0.675, H - 30, 13, '#fff4dc');
    ctx.restore();
  }
}
function overlay(alpha) { ctx.fillStyle = `rgba(20,12,22,${alpha})`; ctx.fillRect(0, 0, W, H); }
function drawTitle() {
  overlay(0.35);
  text('SAGHRO TREK', W / 2, 78, 46, '#ffe2b0', 'center', SERIF, '700');
  text('A trail run across the Jbel Saghro', W / 2, 114, 15, '#f6e3c3');
  const bw = Math.min(W - 40, 430), bx = W / 2 - bw / 2;
  ctx.fillStyle = 'rgba(30,18,26,0.55)'; rr(bx, 136, bw, 96, 12); ctx.fill();
  if (isTouch) {
    text('Tap the right side to jump. Tap again for a double jump.', W / 2, 156, 13, '#fff4dc');
    text('Hold the left side to duck.', W / 2, 176, 13, '#fff4dc');
  } else {
    text('Space / ↑ to jump. Hold for higher, press again to double-jump.', W / 2, 156, 13, '#fff4dc');
    text('↓ to duck  ·  P to pause  ·  M for sound', W / 2, 176, 13, '#fff4dc');
  }
  text('Collect dates · grab water before you run dry', W / 2, 198, 12, '#f1c27d');
  text('Mint tea = a few seconds of invincibility', W / 2, 216, 12, '#ffd36b');
  const pulse = 0.6 + 0.4 * Math.sin(stateT * 4);
  ctx.save(); ctx.globalAlpha = pulse;
  text(isTouch ? 'Tap to start' : 'Press Space or click to start', W / 2, 256, 18, '#ffffff');
  ctx.restore();
  if (best.score > 0) text(`Best: ${best.score.toLocaleString('en-US')}  ·  ${best.km.toFixed(2)} km`, W / 2, H - 22, 12, '#f6e3c3');
}
function drawOver() {
  overlay(Math.min(0.5, stateT));
  if (stateT < 0.4) return;
  const bw = Math.min(W - 40, 360), bx = W / 2 - bw / 2, by = 46;
  ctx.fillStyle = 'rgba(30,18,26,0.75)'; rr(bx, by, bw, 236, 14); ctx.fill();
  text('Trek over', W / 2, by + 30, 30, '#ffe2b0', 'center', SERIF, '700');
  const why = g.reason === 'thirst' ? `You ran out of water past ${g.lastWp}.` : `One tumble too many past ${g.lastWp}.`;
  text(why, W / 2, by + 60, 13, '#f6e3c3');
  text(score().toLocaleString('en-US'), W / 2, by + 98, 36, '#ffffff');
  text(`${(g.meters / 1000).toFixed(2)} km  ·  ${g.dates} dates`, W / 2, by + 130, 13, '#f6e3c3');
  if (g.newBest) text('New personal best!', W / 2, by + 154, 14, '#ffd36b');
  else text(`Best: ${best.score.toLocaleString('en-US')}`, W / 2, by + 154, 13, '#c9b49a');
  text(tip, W / 2, by + 182, 11, '#c9b49a');
  if (stateT > 0.7) {
    ctx.save(); ctx.globalAlpha = 0.6 + 0.4 * Math.sin(stateT * 4);
    text(isTouch ? 'Tap to hike again' : 'Space or click to hike again', W / 2, by + 212, 16, '#ffffff');
    ctx.restore();
  }
}
function drawPaused() {
  overlay(0.45);
  text('Paused', W / 2, H / 2 - 16, 34, '#ffe2b0', 'center', SERIF, '700');
  text(isTouch ? 'Tap to resume' : 'Press P, Space or click to resume', W / 2, H / 2 + 22, 14, '#f6e3c3');
}

// ---------------------------------------------------------------- render
function render() {
  ctx.setTransform(cvs.width / W, 0, 0, cvs.height / H, 0, 0);
  ctx.save();
  if (g.shake > 0) ctx.translate((Math.random() - 0.5) * 8 * g.shake / 0.35, (Math.random() - 0.5) * 6 * g.shake / 0.35);
  const sk = sky(g.phase), n = sk.n;
  nightness = n;

  const gr = ctx.createLinearGradient(0, 0, 0, GROUND);
  gr.addColorStop(0, sk.top); gr.addColorStop(1, sk.bot);
  ctx.fillStyle = gr; ctx.fillRect(-10, -10, W + 20, GROUND + 20);

  if (n > 0.05) {
    for (const s of STARS) {
      ctx.globalAlpha = n * (0.55 + 0.45 * Math.sin(g.t * 2 + s.tw));
      ctx.fillStyle = '#fff8e6'; ctx.fillRect(s.x * W, s.y * GROUND, s.s, s.s);
    }
    ctx.globalAlpha = 1;
  }
  // sun & moon
  const ph = g.phase;
  if (ph < 0.66) {
    const u = ph / 0.66, sx = W * (0.08 + 0.84 * u), sy = GROUND - 20 - Math.sin(u * Math.PI) * (GROUND - 80);
    ctx.fillStyle = 'rgba(255,230,160,0.25)'; ellipse(sx, sy, 30, 30); ctx.fill();
    ctx.fillStyle = '#fff1c4'; ellipse(sx, sy, 16, 16); ctx.fill();
  }
  const mp = (ph - 0.62 + 1) % 1;
  if (mp < 0.42) {
    const u = mp / 0.42, mx = W * (0.08 + 0.84 * u), my = GROUND - 20 - Math.sin(u * Math.PI) * (GROUND - 90);
    ctx.fillStyle = '#f4f1e2'; ellipse(mx, my, 12, 12); ctx.fill();
    ctx.fillStyle = sk.top; ellipse(mx + 5, my - 3, 10, 10); ctx.fill();
  }

  drawRidge(0.05, GROUND - 30, 120, 0.006, 1.7, mix('#9d7f9a', sk.botHex, 0.35));
  drawRidge(0.12, GROUND - 12, 72, 0.011, 4.2, mix('#a8705a', sk.botHex, 0.12));
  drawMidLayer();
  if (n > 0) { ctx.fillStyle = `rgba(12,14,40,${0.5 * n})`; ctx.fillRect(-10, -10, W + 20, GROUND + 20); }

  drawGround();
  for (const it of g.items) drawItem(it);
  for (const o of g.obs) if (o.type !== 'raven') drawObstacle(o);
  drawMule();
  drawHiker();
  for (const o of g.obs) if (o.type === 'raven') drawObstacle(o);
  for (const q of g.parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.color; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;

  if (n > 0) {
    ctx.fillStyle = `rgba(12,14,40,${0.3 * n})`; ctx.fillRect(-10, -10, W + 20, H + 20);
    // headlamp
    if (n > 0.3 && state !== 'over') {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const hx = p.x + 6, hy = p.y - 38 * ((p.duck && p.onGround) ? 0.6 : 1);
      const lg = ctx.createRadialGradient(hx + 70, hy + 30, 5, hx + 70, hy + 30, 130);
      lg.addColorStop(0, `rgba(255,220,150,${0.22 * n})`); lg.addColorStop(1, 'rgba(255,220,150,0)');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + 220, hy - 40); ctx.lineTo(hx + 220, GROUND + 50); ctx.lineTo(hx + 10, GROUND + 8); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();

  if (state === 'play' || state === 'paused' || state === 'over') drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'paused') drawPaused();
  if (state === 'over') drawOver();
  drawButtons();
}

// ---------------------------------------------------------------- input
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
const DUCK_KEYS = ['ArrowDown', 'KeyS'];
window.addEventListener('keydown', e => {
  if (JUMP_KEYS.includes(e.code) || DUCK_KEYS.includes(e.code)) e.preventDefault();
  ensureAudio();
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') pause(); else if (state === 'paused') resume(); return; }
  if (JUMP_KEYS.includes(e.code) || e.code === 'Enter') {
    if (e.repeat) return;
    if (state === 'title' || state === 'over') { tryStart(); return; }
    if (state === 'paused') { resume(); return; }
    input.kJump = true; p.buffer = 0.12;
  }
  if (DUCK_KEYS.includes(e.code) && state === 'play') input.kDuck = true;
});
window.addEventListener('keyup', e => {
  if (JUMP_KEYS.includes(e.code) || e.code === 'Enter') input.kJump = false;
  if (DUCK_KEYS.includes(e.code)) input.kDuck = false;
});
function toLogical(e) {
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
const inBtn = (pt, b) => pt.x >= b.x - 6 && pt.x <= b.x + b.w + 6 && pt.y >= b.y - 6 && pt.y <= b.y + b.h + 6;
cvs.addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio(); cvs.focus();
  if (e.pointerType !== 'mouse') isTouch = true;
  const pt = toLogical(e);
  if (inBtn(pt, muteBtn())) { toggleMute(); return; }
  if (state === 'play' && inBtn(pt, pauseBtn())) { pause(); return; }
  if (state === 'title' || state === 'over') { tryStart(); return; }
  if (state === 'paused') { resume(); return; }
  try { cvs.setPointerCapture(e.pointerId); } catch (_) {}
  if (e.pointerType !== 'mouse' && pt.x < W * 0.35) pointers.set(e.pointerId, 'duck');
  else { pointers.set(e.pointerId, 'jump'); p.buffer = 0.12; }
});
const release = e => pointers.delete(e.pointerId);
cvs.addEventListener('pointerup', release);
cvs.addEventListener('pointercancel', release);
cvs.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', pause);

// ---------------------------------------------------------------- loop
newGame();
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000));
  last = now;
  if (state === 'paused') stateT += dt; else update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Cache for offline play when served over http(s), e.g. GitHub Pages.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
